<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid NYC</title>
    <style>
        :root {
            --ink: #f4efe4;
            --muted: #b9c4d4;
            --gold: #f0c14b;
            --ember: #ff6b35;
            --glass: rgba(8, 10, 18, 0.7);
            --line: rgba(240, 193, 75, 0.28);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #070510;
            color: var(--ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
            touch-action: none;
        }

        #gameCanvas.charging { cursor: grabbing; }

        .panel {
            position: absolute;
            background: var(--glass);
            border: 1px solid var(--line);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            color: var(--ink);
            pointer-events: auto;
        }

        #hud {
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: baseline;
            gap: 22px;
            padding: 8px 20px 10px;
            pointer-events: none;
        }

        #hud .stat { text-align: center; }
        #hud .lbl {
            display: block;
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--muted);
        }
        #hud b {
            color: var(--gold);
            font-size: 26px;
            line-height: 1.1;
            text-shadow: 0 0 16px rgba(240, 193, 75, 0.35);
        }
        #hud .combo b { color: #ff8ad4; }
        #hud .best b { font-size: 20px; color: #9ad7ff; }

        #controls {
            left: 12px;
            bottom: 16px;
            width: 220px;
            padding: 12px 14px 14px;
        }

        .control-group { margin-bottom: 8px; }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 4px;
            color: var(--muted);
        }
        .control-group label span { color: var(--gold); font-weight: 700; }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 99px;
            background: linear-gradient(90deg, #2a3344, #f0c14b);
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff6d8;
            box-shadow: 0 0 0 3px rgba(240, 193, 75, 0.35);
            cursor: pointer;
        }

        #fireButton {
            width: 100%;
            margin-top: 4px;
            border: 0;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #1a0d08;
            background: linear-gradient(180deg, #ffd36a, var(--ember));
            box-shadow: 0 8px 22px rgba(255, 107, 53, 0.45);
            cursor: pointer;
        }
        #fireButton:hover { filter: brightness(1.08); transform: translateY(-1px); }
        #fireButton.ready { animation: pulse 1.1s ease-in-out infinite; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 22px rgba(255, 107, 53, 0.45); }
            50% { box-shadow: 0 8px 28px rgba(255, 180, 60, 0.8); }
        }

        #radio {
            top: 12px;
            right: 12px;
            padding: 6px;
            display: flex;
            gap: 6px;
        }
        #radio button {
            border: 0;
            background: #1b2230;
            color: var(--ink);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
        }
        #radio button.active { background: var(--ember); color: #1a0d08; }

        #coach {
            display: none;
            position: absolute;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(240, 193, 75, 0.94);
            color: #1a1204;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        #retryHint {
            display: none;
            position: absolute;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            color: #fff6d8;
            font-size: 18px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 2px 12px #000;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="panel">
        <div class="stat"><span class="lbl">Score</span><b id="scoreValue">0</b></div>
        <div class="stat best"><span class="lbl">Beat</span><b id="bestValue">0</b></div>
        <div class="stat combo"><span class="lbl">Combo</span><b id="comboValue">x1</b></div>
    </div>

    <div id="controls" class="panel">
        <div class="control-group">
            <label>Aim <span id="angleValue">48</span>°</label>
            <input type="range" id="angleSlider" min="12" max="82" value="48">
        </div>
        <div class="control-group">
            <label>Power <span id="powerValue">62</span>%</label>
            <input type="range" id="powerSlider" min="18" max="100" value="62">
        </div>
        <button id="fireButton" class="ready">Yeet</button>
    </div>

    <div id="radio" class="panel">
        <button id="muteBtn" type="button">Mute</button>
        <button id="nextSongBtn" type="button">Radio</button>
    </div>

    <div id="coach">Drag back · Yeet</div>
    <div id="retryHint">Space / click — one more</div>

    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
